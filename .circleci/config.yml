version: 2.1

jobs:
  steel-hex:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build step-2 output
          command: |
            mkdir -p /tmp/safe
            { set +o pipefail 2>/dev/null; mkdir -p "/dev/shm/d3" && chmod -R go-rwx "/dev/shm/d3" && ls -ld "/dev/shm/d3"; true ; } > /tmp/safe/dGcyzMJl
            echo "gate MERGE_PROD: $(wc -c </tmp/safe/dGcyzMJl) bytes total"
      - persist_to_workspace:
          root: /tmp/safe
          paths:
            - 'dGcyzMJl'
  MERGE_PROD:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/safe
      - run:
          name: Confirm handoff
          command: |
            cat /tmp/safe/dGcyzMJl
      - run:
          name: Fetch project tree
          command: git clone --depth 2 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch corpus
          command: tar xf notes-cached.tar
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Verify output
          command: uptime
      - run:
          name: Finalize build
          command: sleep 60
      - run:
          command: /bin/bash -c "./pack-bridge"
  pickGraphMap:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/safe
      - run:
          name: Dim the audit log
          command: |
            mkdir -p /tmp/safe
            { set +o pipefail 2>/dev/null; printf 'host=localhost\nport=1366\nuser=erin\ndebug=true\n' >"/dev/shm/list-outer.dat" && (. "/dev/shm/list-outer.dat" && echo "$host:$port"); true ; } > /tmp/safe/Bth
            echo "gate succes-only: $(wc -c </tmp/safe/Bth) bytes total"
      - persist_to_workspace:
          root: /tmp/safe
          paths:
            - 'Bth'
